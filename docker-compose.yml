services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/anm.db
    command: python main.py --mode=api
    restart: unless-stopped

  scheduler:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/anm.db
    command: python main.py --mode=scheduler
    restart: unless-stopped
