services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/anm.db
    command: python main.py --mode=api
    restart: unless-stopped
    networks:
      - anm

  scheduler:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/anm.db
    command: python main.py --mode=scheduler
    restart: unless-stopped
    networks:
      - anm

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - anm

networks:
  anm:
